<!DOCTYPE html> <html lang="de"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Gaußsche Ausgleichsgerade – Interaktive Karte</title> <script src="https://cdn.tailwindcss.com"></script> <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" /> <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script> <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet"> <script src="https://www.google.com/recaptcha/api.js" async defer></script> <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } #map { height: 100%; width: 100%; border-radius: 0.75rem; z-index: 0; } </style> </head> <body class="bg-slate-100 text-slate-800 min-h-screen lg:h-screen flex flex-col lg:overflow-hidden selection:bg-emerald-500 selection:text-white">

<div id="captcha-overlay" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-[2000] flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-md w-full border border-slate-200 text-center">
        <div class="bg-emerald-600 w-16 h-16 rounded-full flex items-center justify-center text-white mx-auto mb-4 shadow-lg">
            <i class="fa-solid fa-shield-halved text-2xl"></i>
        </div>
        <h2 class="text-2xl font-bold text-slate-900 mb-2">Verifizierung</h2>
        <p class="text-slate-500 mb-6">Bitte bestätige deine Identität, um die Geodaten zu laden.</p>
        <form action="/api/verify" method="POST" class="space-y-6">
            <div class="flex justify-center">
                <div class="g-recaptcha" data-sitekey="6LcgWvQsAAAAALl7vTWJte6YmTq2x72Q31_zPecB"></div>
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition-all shadow-md">
                Daten freischalten
            </button>
        </form>
    </div>
</div>

<header class="bg-white border-b border-slate-200 px-6 py-4 flex flex-col lg:flex-row items-center justify-between gap-4 z-10 shrink-0 shadow-sm">
    <div class="flex items-center space-x-3.5">
        <div class="bg-emerald-600 p-2.5 rounded-xl text-white shadow-md">
            <i class="fa-solid fa-map-location-dot text-xl"></i>
        </div>
        <div>
            <h1 class="text-lg font-bold tracking-tight text-slate-900">Der vermessene Wald</h1>
            <p class="text-xs text-emerald-600 font-bold tracking-wider uppercase">Mystery Cache</p>
        </div>
    </div>
    <div class="flex items-center gap-3">
        <a id="sheet-link" href="#" target="_blank" class="bg-white hover:bg-slate-50 text-slate-600 text-xs px-3.5 py-2 rounded-lg border border-slate-200 font-semibold shadow-sm flex items-center gap-1.5 transition-colors">
            <i class="fa-solid fa-table text-emerald-600"></i> Google Sheets
        </a>
    </div>
</header>

<main class="flex-1 flex flex-col lg:flex-row lg:overflow-hidden w-full mx-auto relative">
    <section class="w-full lg:w-[400px] bg-white border-b lg:border-r border-slate-200 flex flex-col shrink-0 lg:h-full lg:overflow-y-auto p-5 space-y-5 shadow-sm z-10">
        <div class="bg-slate-900 rounded-xl p-4 text-center">
            <div id="equation-display" class="text-emerald-400 font-mono text-lg font-bold">Lade Daten...</div>
        </div>
        <div class="space-y-4">
            <div class="space-y-2">
                <div class="flex justify-between items-center"><label class="text-xs font-bold text-slate-500">Steigung (m)</label><span id="m-val" class="font-mono text-emerald-700 font-bold">1.0000</span></div>
                <input id="slider-m" type="range" min="0.5" max="1.5" step="0.0001" value="1.0" class="w-full h-1.5 accent-emerald-500">
            </div>
            <div class="space-y-2">
                <div class="flex justify-between items-center"><label class="text-xs font-bold text-slate-500">Achsenabschnitt (c')</label><span id="c-val" class="font-mono text-emerald-700 font-bold">-20.0000</span></div>
                <input id="slider-c" type="range" min="-32" max="-20" step="0.001" value="-20.0" class="w-full h-1.5 accent-emerald-500">
            </div>
        </div>
        <div class="bg-white border rounded-2xl p-4 space-y-4 shadow-sm">
            <div class="flex justify-between">
                <div><span class="text-[10px] font-bold text-slate-400 uppercase">SSE</span><div id="sse-display" class="text-lg font-bold font-mono text-rose-500">...</div></div>
                <div class="text-right"><span class="text-[10px] font-bold text-slate-400 uppercase">Genauigkeit</span><div id="accuracy-display" class="text-lg font-bold font-mono text-blue-600">0.0%</div></div>
            </div>
            <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden"><div id="accuracy-bar" class="h-full bg-emerald-500" style="width: 0%"></div></div>
            <div class="bg-slate-50 p-3 rounded-xl space-y-2">
                <div class="flex justify-between text-xs font-mono"><span>Prognose x=32.841</span><span id="predictor-display">y = ???</span></div>
                <div class="flex justify-between items-center bg-white p-2 rounded border font-mono text-sm"><span class="text-[10px] text-slate-500">KOORD</span><span id="coord-display">N 47° ??.???'</span></div>
            </div>
        </div>
        <div id="success-card" class="bg-emerald-50 border-2 border-emerald-200 rounded-2xl p-5 shadow-lg hidden text-center">
            <div class="text-emerald-500 text-3xl mb-2"><i class="fa-solid fa-lock-open"></i></div>
            <h3 class="text-sm font-bold text-emerald-600 uppercase mb-3">Rätsel gelöst!</h3>
            <div id="final-equation" class="text-xs font-mono text-emerald-700 bg-white py-1 mb-2 rounded border">...</div>
            <div id="final-coords" class="text-lg font-bold text-slate-900 bg-white py-2 rounded-lg border-2 border-emerald-400">...</div>
        </div>
    </section>
    <section class="h-[500px] lg:h-auto lg:flex-1 relative p-4 bg-slate-100"><div id="map"></div></section>
</main>

<script>
let caches = [], secureData = {}, map, markerGroup, lineGroup, unlocked = false;
let userSlope = 0.8, userIntercept = -17.0, minSSE = 0, trueSlope = 0, trueIntercept = 0;

async function loadData() {
    const res = await fetch('/api/data');
    if (res.ok) {
        const data = await res.json();
        caches = data.caches;
        secureData = data;
        document.getElementById('captcha-overlay').classList.add('hidden');
        document.getElementById('sheet-link').href = secureData.sheetLink;
        initMap();
    }
}

function minToLat(y) { return 47.0 + (y / 60.0); }
function minToLon(x) { return 7.0 + (x / 60.0); }

function initMap() {
    map = L.map('map').setView([47.142, 7.533], 13);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(map);
    markerGroup = L.layerGroup().addTo(map);
    lineGroup = L.layerGroup().addTo(map);
    const icon = L.divIcon({className:'bg-emerald-500 w-3 h-3 rounded-full border border-white'});
    caches.forEach(c => L.marker([c.lat, c.lon], {icon}).addTo(markerGroup));
    
    let sX=0, sY=0, sXY=0, sXX=0, N=caches.length;
    caches.forEach(c => { sX+=c.x; sY+=c.y; sXY+=c.x*c.y; sXX+=c.x*c.x; });
    trueSlope = (N*sXY - sX*sY) / (N*sXX - sX*sX);
    trueIntercept = (sY - trueSlope*sX) / N;
    caches.forEach(c => minSSE += Math.pow(c.y - (trueSlope*c.x + trueIntercept), 2));
    update();
}

function update() {
    let userSSE = 0;
    caches.forEach(c => userSSE += Math.pow(c.y - (userSlope*c.x + userIntercept), 2));
    const acc = Math.max(0, 100 * (1 - (userSSE - minSSE) / (minSSE * 1.5)));
    document.getElementById('sse-display').innerText = userSSE.toFixed(4);
    document.getElementById('accuracy-display').innerText = acc.toFixed(1) + '%';
    document.getElementById('accuracy-bar').style.width = acc + '%';
    document.getElementById('equation-display').innerText = `y = ${userSlope.toFixed(4)} · x ${userIntercept>=0?'+':'-'} ${Math.abs(userIntercept).toFixed(4)}`;
    const pY = userSlope * 32.841 + userIntercept;
    document.getElementById('predictor-display').innerText = `y = ${pY.toFixed(3)}`;
    document.getElementById('coord-display').innerText = `N 47° ${pY < 10 ? '0' : ''}${pY.toFixed(3)}'`;
    
    lineGroup.clearLayers();
    L.polyline([[minToLat(userSlope*30.5+userIntercept), minToLon(30.5)], [minToLat(userSlope*33.5+userIntercept), minToLon(33.5)]], {color:'#ef4444', weight:3}).addTo(lineGroup);
    caches.forEach(c => {
        const py = userSlope*c.x+userIntercept;
        const err = Math.abs(c.y-py);
        L.polyline([[c.lat, c.lon], [minToLat(py), c.lon]], {color:`hsl(${Math.max(0, Math.min(120, 120-(err*150)))},80%,50%)`, weight:1.5, dashArray:'4,4'}).addTo(lineGroup);
    });

    if (acc >= 99.8 && !unlocked) {
        unlocked = true;
        document.getElementById('success-card').classList.remove('hidden');
        const fX=32.841, fY=trueSlope*fX+trueIntercept;
        L.marker([minToLat(fY), minToLon(fX)], {icon: L.divIcon({className:'bg-rose-500 w-6 h-6 rounded-full border-2 border-white animate-bounce'})}).addTo(map).bindPopup('Final').openPopup();
        map.flyTo([minToLat(fY), minToLon(fX)], 14);
        document.getElementById('final-equation').innerText = secureData.successEquation;
        document.getElementById('final-coords').innerText = `${secureData.finalLat} / ${secureData.finalLon}`;
    }
}

function adjustValue(p, v) {
    if (unlocked) return;
    if (p==='m') userSlope+=v; else userIntercept+=v;
    document.getElementById('m-val').innerText = userSlope.toFixed(4);
    document.getElementById('c-val').innerText = userIntercept.toFixed(4);
    document.getElementById('slider-m').value = userSlope;
    document.getElementById('slider-c').value = userIntercept;
    update();
}

document.getElementById('slider-m').oninput = e => { userSlope = parseFloat(e.target.value); document.getElementById('m-val').innerText = userSlope.toFixed(4); update(); };
document.getElementById('slider-c').oninput = e => { userIntercept = parseFloat(e.target.value); document.getElementById('c-val').innerText = userIntercept.toFixed(4); update(); };

loadData();
</script> </body> </html>
